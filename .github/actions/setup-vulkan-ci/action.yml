name: Vulkan SDK and SwiftShader
description: Install pinned VulkanCI assets with V and configure the runner environment
inputs:
  sdk-version:
    description: Vulkan SDK version used in the VulkanCI asset names
    required: true
  artifact-tag:
    description: VulkanCI release tag that contains the SDK and SwiftShader archives
    required: true
  bindings-path:
    description: Optional Vulkan bindings checkout whose registry and Volk commits select the SDK headers
    required: false
    default: ''
  volk-revision:
    description: Optional separate Volk commit to install in the SDK
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install the SDK and software driver
      shell: bash
      env:
        VULKAN_CI_SDK_VERSION: ${{ inputs.sdk-version }}
        VULKAN_CI_ARTIFACT_TAG: ${{ inputs.artifact-tag }}
      run: |
        v run "$GITHUB_ACTION_PATH/../../scripts/setup-vulkan-ci.vsh" \
          "$VULKAN_CI_SDK_VERSION" "$VULKAN_CI_ARTIFACT_TAG"
    - name: Install binding-matched headers and Volk
      if: inputs.bindings-path != ''
      shell: bash
      env:
        VULKAN_CI_BINDINGS_PATH: ${{ inputs.bindings-path }}
        VULKAN_CI_VOLK_REVISION: ${{ inputs.volk-revision }}
      run: v run "$GITHUB_ACTION_PATH/../../scripts/binding-headers.vsh" install "$VULKAN_CI_BINDINGS_PATH" "$VULKAN_CI_VOLK_REVISION"
    - name: Install a separately pinned Volk revision
      if: inputs.bindings-path == '' && inputs.volk-revision != ''
      shell: bash
      env:
        VULKAN_CI_VOLK_REVISION: ${{ inputs.volk-revision }}
      run: v run "$GITHUB_ACTION_PATH/../../scripts/binding-headers.vsh" install-volk "$VULKAN_CI_VOLK_REVISION"
