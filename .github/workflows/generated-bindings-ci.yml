name: Validate Vulkan bindings

on:
  pull_request:
    branches: [master]
  push:
    paths-ignore: ['**/*.md']
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-vulkan-${{ github.ref }}
  cancel-in-progress: true

env:
  V_C_ERROR_BUG_REPORT_DISABLED: 1

jobs:
  generated-change-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run scripts/compatibility.vsh --self-test
          v run ./scripts/doctor.vsh --self-test
          v run scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - name: Test the generated-change policy
        run: v run .github/scripts/generated-change-scope.vsh --self-test
      - name: Test Vulkan package release metadata
        run: v run .github/scripts/package-release.vsh --self-test
      - name: Verify generated binding change scope
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: v run .github/scripts/generated-change-scope.vsh

  compile-smoke-matrix:
    name: compile-smoke-test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.v-channel }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            v-channel: stable
          - os: ubuntu-24.04
            compiler: gcc
            v-channel: master
          - os: ubuntu-24.04
            compiler: tcc
            v-channel: v3
          - os: macos-15
            compiler: clang
            v-channel: stable
          - os: windows-2022
            compiler: msvc
            v-channel: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run scripts/compatibility.vsh --self-test
          v run ./scripts/doctor.vsh --self-test
          v run scripts/compatibility.vsh --profile '${{ matrix.v-channel }}' --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/v_vulkan_bindings
          ref: ${{ steps.compat.outputs.generator }}
          path: generator
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        if: matrix.v-channel == 'stable' && steps.compat.outputs.selected_v != '0.5.2'
        with:
          version: ${{ steps.compat.outputs.selected_v }}
      # Source-built V revisions include the v1_fallback executable needed by
      # tool commands such as `v test`; setup-v-action@v4 omits it from cache.
      - name: Check out source-built V
        if: matrix.v-channel != 'stable'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout_v_source
        continue-on-error: ${{ matrix.v-channel == 'master' }}
        with:
          repository: vlang/v
          ref: ${{ steps.compat.outputs.selected_v }}
          path: .ci-v-source
          fetch-depth: 1
      - name: Check out the matching v3 bootstrap source
        if: matrix.v-channel == 'v3' && steps.checkout_v_source.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/vc
          ref: ${{ steps.compat.outputs.v3_vc }}
          path: .ci-v-source/vc
          fetch-depth: 1
      - name: Check out the matching v3 TinyCC runtime
        if: matrix.v-channel == 'v3' && steps.checkout_v_source.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: vlang/tccbin
          ref: ${{ steps.compat.outputs.v3_tcc }}
          path: .ci-v-source/thirdparty/tcc
          fetch-depth: 1
      - name: Build source V compiler
        if: matrix.v-channel != 'stable' && steps.checkout_v_source.outcome == 'success'
        id: setup_v_source
        continue-on-error: ${{ matrix.v-channel == 'master' }}
        shell: bash
        run: |
          if [[ "${{ matrix.v-channel }}" == v3 ]]; then
            make -C .ci-v-source local=1
          else
            make -C .ci-v-source
          fi
          echo "$GITHUB_WORKSPACE/.ci-v-source" >> "$GITHUB_PATH"
          .ci-v-source/v version
      - name: Check the SDK setup entry point
        if: runner.os == 'Linux' && (matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success')
        run: sh .github/scripts/setup-vulkan-ci.sh --help
      - name: Install Vulkan SDK and SwiftShader test artifacts
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        uses: ./.github/actions/setup-vulkan-ci
        with:
          sdk-version: ${{ steps.compat.outputs.ci_sdk }}
          artifact-tag: ${{ steps.compat.outputs.ci_runtime }}
      - name: Verify bundled headers and Volk against pinned upstream sources
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        run: v run .github/scripts/binding-headers.vsh verify .
      - name: Verify the public setup diagnostics
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        shell: bash
        run: v run setup.vsh --check
      - name: Test runtime probe execution and working directory
        if: matrix.v-channel == 'stable'
        shell: bash
        run: v run ci/test_setup_runtime.vsh --cc "${{ matrix.compiler }}"
      - name: Accept old installed headers with bundled build inputs
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          old_sdk="$RUNNER_TEMP/old-vulkan-sdk"
          mkdir -p "$old_sdk/include/vulkan" "$old_sdk/include/volk"
          touch "$old_sdk/include/vulkan/vulkan.h" "$old_sdk/include/volk/volk.h"
          cat > "$old_sdk/include/vulkan/vulkan_core.h" <<'EOF'
          #define VK_HEADER_VERSION 275
          #define VK_HEADER_VERSION_COMPLETE VK_MAKE_API_VERSION(0, 1, 3, VK_HEADER_VERSION)
          EOF
          VULKAN_SDK="$old_sdk" v run setup.vsh --check > "$RUNNER_TEMP/old-header-check.log"
          cat "$RUNNER_TEMP/old-header-check.log"
          registry_version=$(tr -d '\r\n' < VERSION)
          expected="Bundled Vulkan headers ${registry_version#v} cover registry ${registry_version#v}"
          grep -F "$expected" \
            "$RUNNER_TEMP/old-header-check.log"
      - name: Stage pinned headers for the stable Linux smoke test
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        uses: ./.github/actions/stage-vulkan-headers
        with:
          bindings-path: .
      - name: Assemble isolated module
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          module_root="$RUNNER_TEMP/vmodules/antono2/vulkan"
          mkdir -p "$module_root/c" "$module_root/ergonomic"
          cp vulkan.v vulkan_video.v loader.v v.mod VERSION REGISTRY_COMMIT VOLK_COMMIT "$module_root/"
          cp c/loader_bridge.h c/volk.c.v c/volk_impl.h c/vulkan_core_prelude.h "$module_root/c/"
          cp -R c/vendor "$module_root/c/"
          cp ergonomic/*.v "$module_root/ergonomic/"
          echo "VMODULES=$RUNNER_TEMP/vmodules" >> "$GITHUB_ENV"
      - name: Type-check with the strict V3 frontend
        if: matrix.v-channel == 'v3'
        shell: bash
        run: |
          set -euo pipefail
          v \
            -new-compiler \
            -check \
            -cflags "-I$VMODULES/antono2/vulkan/c/vendor/include -I$VMODULES/antono2/vulkan/c/vendor/volk -I$VMODULES/antono2/vulkan -I$VULKAN_SDK/include" \
            generator/test/main.c.v
          v \
            -new-compiler \
            -d vulkan_xlib \
            -check \
            -cflags "-I$VMODULES/antono2/vulkan/c/vendor/include -I$VMODULES/antono2/vulkan/c/vendor/volk -I$VMODULES/antono2/vulkan -I$VULKAN_SDK/include" \
            generator/test/main.c.v
          v \
            -new-compiler \
            -check \
            -cflags "-I$VMODULES/antono2/vulkan/c/vendor/include -I$VMODULES/antono2/vulkan/c/vendor/volk -I$VMODULES/antono2/vulkan -I$VULKAN_SDK/include" \
            ci/bundled_header_smoke
      - name: Compile smoke test and ergonomic unit tests
        id: compile
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        continue-on-error: ${{ matrix.v-channel != 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          v_flags=(-cc "${{ matrix.compiler }}")
          if [[ "${{ matrix.v-channel }}" == v3 ]]; then
            # Strict V3 does not yet expand module-relative or environment-
            # derived #flag include paths, so pass the verified paths explicitly.
            v_flags=(
              -new-compiler
              "${v_flags[@]}"
              -cflags "-I$VMODULES/antono2/vulkan/c/vendor/include -I$VMODULES/antono2/vulkan/c/vendor/volk -I$VMODULES/antono2/vulkan -I$VULKAN_SDK/include"
            )
          fi
          if [[ "${{ runner.os }}" == macOS ]]; then
            v "${v_flags[@]}" -o "$RUNNER_TEMP/vulkan-smoke" generator/test
          else
            v "${v_flags[@]}" run generator/test
          fi
          v "${v_flags[@]}" -o "$RUNNER_TEMP/bundled-header-smoke" ci/bundled_header_smoke
          v "${v_flags[@]}" run ci/header_order_smoke
          v "${v_flags[@]}" test ergonomic
          v run scripts/check_docs.vsh
          v "${v_flags[@]}" -o "$RUNNER_TEMP/vulkan-first-use" examples/getting_started
          v "${v_flags[@]}" -o "$RUNNER_TEMP/vulkan-conveniences" examples/conveniences
          if [[ "${{ runner.os }}" == Linux && "${{ matrix.v-channel }}" == stable ]]; then
            v -d vulkan_xlib -cc "${{ matrix.compiler }}" \
              -o "$RUNNER_TEMP/vulkan-xlib-smoke" ci/platform_xlib
          fi
      - name: Validate TinyCC loader and ergonomic API
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          v run ci/test_setup_preserves_module.vsh
          v -cc tcc test ergonomic
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            v -cc tcc run examples/ergonomic_lifecycle
      - name: Exercise current V3 device discovery and lifecycle
        if: runner.os == 'Linux' && matrix.v-channel == 'master'
        shell: bash
        run: |
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            v -new-compiler -cc gcc run examples/ergonomic_lifecycle
      - name: Check out presentation example dependency
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: antono2/glfw
          ref: v2.0.1
          path: .ci-glfw
      - name: Validate presentation and resize
        env:
          GLFW_INCLUDE: /usr/include
          GLFW_LIB: /usr/lib/x86_64-linux-gnu
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libx11-dev openbox xvfb xauth mesa-vulkan-drivers vulkan-validationlayers
          mkdir -p "$VMODULES/antono2/glfw"
          cp -R .ci-glfw/. "$VMODULES/antono2/glfw/"
          v -cc gcc -o "$RUNNER_TEMP/presentation" examples/presentation
          v -cc tcc -o "$RUNNER_TEMP/window-startup-check" tests/desktop/window_startup.v
          "$RUNNER_TEMP/window-startup-check" "$RUNNER_TEMP/presentation" "$RUNNER_TEMP/window-startup-logs"
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation xvfb-run -a "$RUNNER_TEMP/presentation" > "$RUNNER_TEMP/presentation.log" 2>&1
          cat "$RUNNER_TEMP/presentation.log"
          if grep -Eiq 'Validation (Error|Warning)|VUID-' "$RUNNER_TEMP/presentation.log"; then exit 1; fi
      - name: Report source compiler compatibility warning
        if: always() && matrix.v-channel != 'stable' && (steps.checkout_v_source.outcome == 'failure' || steps.setup_v_source.outcome == 'failure' || steps.compile.outcome == 'failure')
        shell: bash
        run: |
          if [[ "${{ matrix.v-channel }}" == v3 ]]; then
            echo "::warning::The required strict V3 frontend passed, but full V3 C compilation remains advisory."
          else
            echo "::warning::The moving V master compatibility lane failed; stable V 0.5.2 remains authoritative."
          fi
      - name: Run lifecycle under validation
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation v -cc "${{ matrix.compiler }}" run examples/conveniences > "$RUNNER_TEMP/conveniences.log" 2>&1
          cat "$RUNNER_TEMP/conveniences.log"
          if grep -Eiq 'Validation (Error|Warning)|VUID-' "$RUNNER_TEMP/conveniences.log"; then exit 1; fi
          lifecycle_log="$RUNNER_TEMP/vulkan-lifecycle.log"
          set +e
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            v -cc "${{ matrix.compiler }}" run examples/ergonomic_lifecycle \
            >"$lifecycle_log" 2>&1
          lifecycle_status=$?
          set -e
          cat "$lifecycle_log"
          test "$lifecycle_status" -eq 0
          if grep -Eiq 'Validation (Error|Warning)|VUID-' "$lifecycle_log"; then
            echo "Vulkan validation reported a problem" >&2
            exit 1
          fi

  compile-smoke-test:
    name: compile-smoke-test
    if: always()
    needs: compile-smoke-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require the cross-platform matrix to pass
        env:
          MATRIX_RESULT: ${{ needs.compile-smoke-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  tag-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: compile-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: prantlf/setup-v-action@92f20bea50d2c9931a28c96bb4997a3c7357baf0 # v4
        with:
          version: 0.5.2
      - name: Validate and resolve tested compatibility
        id: compat
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          v run scripts/compatibility.vsh --self-test
          v run ./scripts/doctor.vsh --self-test
          v run scripts/compatibility.vsh --github-output "$GITHUB_OUTPUT"
      - name: Validate and publish the package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: v run .github/scripts/package-release.vsh
