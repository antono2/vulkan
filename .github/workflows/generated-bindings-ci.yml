name: Validate Vulkan bindings

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-change-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Accept only generated binding files
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD")
          ((${#changed[@]} > 0)) || {
            echo "The generated update contains no changed files" >&2
            exit 1
          }

          version_changed=false
          registry_commit_changed=false
          for path in "${changed[@]}"; do
            [[ "$path" == VERSION ]] && version_changed=true
            [[ "$path" == REGISTRY_COMMIT ]] && registry_commit_changed=true
          done

          if [[ "$version_changed" == true && "$HEAD_REF" != generated/* ]]; then
            echo "VERSION may only change through a generated/* update branch" >&2
            exit 1
          fi
          if [[ "$HEAD_REF" != generated/* ]]; then
            exit 0
          fi
          [[ "$version_changed" == true ]] || {
            echo "A generated update must change VERSION" >&2
            exit 1
          }
          [[ "$registry_commit_changed" == true ]] || {
            echo "A generated update must change REGISTRY_COMMIT" >&2
            exit 1
          }
          for path in "${changed[@]}"; do
            case "$path" in
              VERSION|REGISTRY_COMMIT|vulkan.v|vulkan_video.v) ;;
              *)
                echo "Unexpected file in generated update: $path" >&2
                exit 1
                ;;
            esac
          done

  compile-smoke-test:
    name: compile-smoke-test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.v-channel }})
    # V master is an early-warning lane. It must not block releases when V
    # itself cannot bootstrap; the stable lanes remain required.
    continue-on-error: ${{ matrix.v-channel == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            v-channel: stable
            v-version: 0.5.2
          - os: ubuntu-24.04
            compiler: gcc
            v-channel: master
            v-version: master
          - os: macos-14
            compiler: clang
            v-channel: stable
            v-version: 0.5.2
          - os: windows-2022
            compiler: msvc
            v-channel: stable
            v-version: 0.5.2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: antono2/v_vulkan_bindings
          ref: d9dc5009c59b11bb5216e3c2890699a92c15be53
          path: generator
      - uses: prantlf/setup-v-action@v4
        with:
          version: ${{ matrix.v-version }}
      - uses: NcStudios/VulkanCI@v1.2
        with:
          sdkVersion: 1.4.309.0
      - name: Install registry-matched headers and pinned Volk
        shell: bash
        run: |
          set -euo pipefail
          registry_commit=$(tr -d '\r\n' < REGISTRY_COMMIT)
          registry_checkout="$RUNNER_TEMP/Vulkan-Headers"
          git init "$registry_checkout"
          git -C "$registry_checkout" remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C "$registry_checkout" fetch --depth 1 origin "$registry_commit"
          git -C "$registry_checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$registry_checkout" rev-parse HEAD)" = "$registry_commit"
          mkdir -p "$VULKAN_SDK/include" "$VULKAN_SDK/include/volk"
          cp -R "$registry_checkout/include/." "$VULKAN_SDK/include/"
          grep -F "#define VK_HEADER_VERSION 362" "$VULKAN_SDK/include/vulkan/vulkan_core.h"

          volk_commit=$(tr -d '\r\n' < VOLK_COMMIT)
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/zeux/volk/$volk_commit/volk.h" \
            --output "$VULKAN_SDK/include/volk/volk.h"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/zeux/volk/$volk_commit/volk.c" \
            --output "$VULKAN_SDK/include/volk/volk.c"
      - name: Assemble isolated module
        shell: bash
        run: |
          set -euo pipefail
          module_root="$RUNNER_TEMP/vmodules/antono2/vulkan"
          mkdir -p "$module_root/c" "$module_root/ergonomic"
          cp vulkan.v vulkan_video.v loader.v v.mod VERSION REGISTRY_COMMIT VOLK_COMMIT "$module_root/"
          cp c/loader_bridge.h c/volk.c.v "$module_root/c/"
          cp ergonomic/ergonomic.v ergonomic/discovery.v ergonomic/configuration.v \
            "$module_root/ergonomic/"
          echo "VMODULES=$RUNNER_TEMP/vmodules" >> "$GITHUB_ENV"
      - name: Compile smoke test and ergonomic unit tests
        shell: bash
        run: |
          set -euo pipefail
          v -cc "${{ matrix.compiler }}" run generator/test
          v -cc "${{ matrix.compiler }}" test ergonomic
      - name: Run lifecycle under validation
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          lifecycle_log="$RUNNER_TEMP/vulkan-lifecycle.log"
          set +e
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            v -cc "${{ matrix.compiler }}" run examples/ergonomic_lifecycle \
            >"$lifecycle_log" 2>&1
          lifecycle_status=$?
          set -e
          cat "$lifecycle_log"
          test "$lifecycle_status" -eq 0
          if grep -Eiq 'Validation (Error|Warning)|VUID-' "$lifecycle_log"; then
            echo "Vulkan validation reported a problem" >&2
            exit 1
          fi

  tag-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: compile-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate and publish the package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version=$(sed -n "s/^[[:space:]]*version: '\([^']*\)'.*/\1/p" v.mod)
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid package version: $package_version" >&2
            exit 1
          }
          test "$GITHUB_REF_NAME" = "v$package_version"
          registry_version=$(tr -d '\r\n' < VERSION)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "antono2.vulkan $GITHUB_REF_NAME (registry $registry_version)"
