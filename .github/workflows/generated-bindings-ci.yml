name: Validate Vulkan bindings

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-change-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Accept only generated binding files
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD")
          ((${#changed[@]} > 0)) || {
            echo "The generated update contains no changed files" >&2
            exit 1
          }

          version_changed=false
          registry_commit_changed=false
          for path in "${changed[@]}"; do
            [[ "$path" == VERSION ]] && version_changed=true
            [[ "$path" == REGISTRY_COMMIT ]] && registry_commit_changed=true
          done

          if [[ "$version_changed" == true && "$HEAD_REF" != generated/* ]]; then
            echo "VERSION may only change through a generated/* update branch" >&2
            exit 1
          fi
          if [[ "$HEAD_REF" != generated/* ]]; then
            exit 0
          fi
          [[ "$version_changed" == true ]] || {
            echo "A generated update must change VERSION" >&2
            exit 1
          }
          [[ "$registry_commit_changed" == true ]] || {
            echo "A generated update must change REGISTRY_COMMIT" >&2
            exit 1
          }
          for path in "${changed[@]}"; do
            case "$path" in
              VERSION|REGISTRY_COMMIT|vulkan.v|vulkan_video.v) ;;
              *)
                echo "Unexpected file in generated update: $path" >&2
                exit 1
                ;;
            esac
          done

  compile-smoke-matrix:
    name: compile-smoke-test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.v-channel }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            v-channel: stable
            v-version: 0.5.2
          - os: ubuntu-24.04
            compiler: gcc
            v-channel: master
            v-version: master
          - os: ubuntu-24.04
            compiler: gcc
            v-channel: v3
            v-version: 5ff8ecb55f6709fd7e6f645ef7779383f30c47c0
          - os: macos-14
            compiler: clang
            v-channel: stable
            v-version: 0.5.2
          - os: windows-2022
            compiler: msvc
            v-channel: stable
            v-version: 0.5.2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: antono2/v_vulkan_bindings
          ref: 2700e4f4c58e9e625657b80f4f44b0584d7c6096
          path: generator
      - uses: prantlf/setup-v-action@v4
        if: matrix.v-channel == 'stable'
        with:
          version: ${{ matrix.v-version }}
      # Source-built V revisions include the v1_fallback executable needed by
      # tool commands such as `v test`; setup-v-action@v4 omits it from cache.
      - name: Check out source-built V
        if: matrix.v-channel != 'stable'
        uses: actions/checkout@v7
        id: checkout_v_source
        continue-on-error: ${{ matrix.v-channel == 'master' }}
        with:
          repository: vlang/v
          ref: ${{ matrix.v-version }}
          path: .ci-v-source
          fetch-depth: 1
      - name: Check out the matching v3 bootstrap source
        if: matrix.v-channel == 'v3' && steps.checkout_v_source.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: vlang/vc
          ref: be46d432d93a61e79bff9e5ba4ed3f8547586708
          path: .ci-v-source/vc
          fetch-depth: 1
      - name: Check out the matching v3 TinyCC runtime
        if: matrix.v-channel == 'v3' && steps.checkout_v_source.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: vlang/tccbin
          ref: d6e7ac1b1bcc98aed734a6ecbfa8509f24606c74
          path: .ci-v-source/thirdparty/tcc
          fetch-depth: 1
      - name: Build source V compiler
        if: matrix.v-channel != 'stable' && steps.checkout_v_source.outcome == 'success'
        id: setup_v_source
        continue-on-error: ${{ matrix.v-channel == 'master' }}
        shell: bash
        run: |
          if [[ "${{ matrix.v-channel }}" == v3 ]]; then
            make -C .ci-v-source local=1
          else
            make -C .ci-v-source
          fi
          echo "$GITHUB_WORKSPACE/.ci-v-source" >> "$GITHUB_PATH"
          .ci-v-source/v -V
      - name: Install Vulkan SDK and SwiftShader test artifacts
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        shell: bash
        run: bash .github/scripts/setup-vulkan-ci.sh 1.4.309.0 v1.2
      - name: Install registry-matched headers and pinned Volk
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          registry_commit=$(tr -d '\r\n' < REGISTRY_COMMIT)
          registry_checkout="$RUNNER_TEMP/Vulkan-Headers"
          git init "$registry_checkout"
          git -C "$registry_checkout" remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
          git -C "$registry_checkout" fetch --depth 1 origin "$registry_commit"
          git -C "$registry_checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$registry_checkout" rev-parse HEAD)" = "$registry_commit"
          mkdir -p "$VULKAN_SDK/include" "$VULKAN_SDK/include/volk"
          cp -R "$registry_checkout/include/." "$VULKAN_SDK/include/"
          grep -F "#define VK_HEADER_VERSION 362" "$VULKAN_SDK/include/vulkan/vulkan_core.h"

          volk_commit=$(tr -d '\r\n' < VOLK_COMMIT)
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/zeux/volk/$volk_commit/volk.h" \
            --output "$VULKAN_SDK/include/volk/volk.h"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/zeux/volk/$volk_commit/volk.c" \
            --output "$VULKAN_SDK/include/volk/volk.c"
      - name: Verify the public setup diagnostics
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        shell: bash
        run: v run setup.vsh --check
      - name: Assemble isolated module
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          module_root="$RUNNER_TEMP/vmodules/antono2/vulkan"
          mkdir -p "$module_root/c" "$module_root/ergonomic"
          cp vulkan.v vulkan_video.v loader.v v.mod VERSION REGISTRY_COMMIT VOLK_COMMIT "$module_root/"
          cp c/loader_bridge.h c/volk.c.v "$module_root/c/"
          cp ergonomic/ergonomic.v ergonomic/discovery.v ergonomic/configuration.v \
            ergonomic/presentation.v ergonomic/resources.v \
            "$module_root/ergonomic/"
          echo "VMODULES=$RUNNER_TEMP/vmodules" >> "$GITHUB_ENV"
      - name: Compile smoke test and ergonomic unit tests
        id: compile
        if: matrix.v-channel == 'stable' || steps.setup_v_source.outcome == 'success'
        continue-on-error: ${{ matrix.v-channel != 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          v_flags=(-cc "${{ matrix.compiler }}")
          if [[ "${{ matrix.v-channel }}" == v3 ]]; then v_flags=(-new-compiler "${v_flags[@]}"); fi
          if [[ "${{ runner.os }}" == macOS ]]; then
            v "${v_flags[@]}" -o "$RUNNER_TEMP/vulkan-smoke" generator/test
          else
            v "${v_flags[@]}" run generator/test
          fi
          v "${v_flags[@]}" test ergonomic
      - name: Validate TinyCC loader and ergonomic API
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          v -cc tcc test ergonomic
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            v -cc tcc run examples/ergonomic_lifecycle
      - name: Report source compiler compatibility warning
        if: always() && matrix.v-channel != 'stable' && (steps.checkout_v_source.outcome == 'failure' || steps.setup_v_source.outcome == 'failure' || steps.compile.outcome == 'failure')
        run: echo "::warning::The ${{ matrix.v-channel }} compatibility lane failed; stable V 0.5.2 remains authoritative."
      - name: Run lifecycle under validation
        if: runner.os == 'Linux' && matrix.v-channel == 'stable'
        shell: bash
        run: |
          set -euo pipefail
          lifecycle_log="$RUNNER_TEMP/vulkan-lifecycle.log"
          set +e
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation \
            v -cc "${{ matrix.compiler }}" run examples/ergonomic_lifecycle \
            >"$lifecycle_log" 2>&1
          lifecycle_status=$?
          set -e
          cat "$lifecycle_log"
          test "$lifecycle_status" -eq 0
          if grep -Eiq 'Validation (Error|Warning)|VUID-' "$lifecycle_log"; then
            echo "Vulkan validation reported a problem" >&2
            exit 1
          fi

  compile-smoke-test:
    name: compile-smoke-test
    if: always()
    needs: compile-smoke-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require the cross-platform matrix to pass
        env:
          MATRIX_RESULT: ${{ needs.compile-smoke-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  tag-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: compile-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate and publish the package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_version=$(sed -n "s/^[[:space:]]*version: '\([^']*\)'.*/\1/p" v.mod)
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid package version: $package_version" >&2
            exit 1
          }
          test "$GITHUB_REF_NAME" = "v$package_version"
          registry_version=$(tr -d '\r\n' < VERSION)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "antono2.vulkan $GITHUB_REF_NAME (registry $registry_version)"
